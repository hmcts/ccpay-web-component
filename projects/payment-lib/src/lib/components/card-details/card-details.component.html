
<div class="column">
  <h2 class="govuk-heading-m govuk-!-margin-top-7">Payment method</h2>
</div>

<div class="govuk-error-summary" data-module="govuk-error-summary" *ngIf="errorMessage">
  <div role="alert">
    <h2 class="govuk-error-summary__title">There is a problem</h2>
    <div class="govuk-error-summary__body">
      Payment method unavailable. The payment has either expired or was unsuccessful.
    </div>
  </div>
</div>

<div *ngIf="!errorMessage && cardDetails">

<table class="govuk-table">
  <tbody class="govuk-table__body">
  <tr class="govuk-table__row">
    <td class="govuk-table__cell tb-col-w">Method</td>
    <td class="govuk-table__cell">Card</td>
  </tr>
  <tr class="govuk-table__row">
    <td class="govuk-table__cell tb-col-w">Type</td>
    <td class="govuk-table__cell">{{ cardDetails.card_brand }}</td>
  </tr>
  </tbody>
</table>
</div>

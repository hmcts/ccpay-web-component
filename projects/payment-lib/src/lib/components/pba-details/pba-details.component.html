
  <h2 class="govuk-heading-l govuk-!-margin-top-7 govuk-!-margin-bottom-4">Payment method</h2>
  <table class="govuk-table">
    <tbody class="govuk-table__body">
    <tr class="govuk-table__row">
      <td class="govuk-table__cell tb-col-w">Method</td>
      <td class="govuk-table__cell capitalize">{{ payment.method | lowercase}}</td>
    </tr>
    <tr class="govuk-table__row">
      <td class="govuk-table__cell tb-col-w">Type</td>
      <td class="govuk-table__cell">Credit</td>
    </tr>
    <tr class="govuk-table__row" *ngIf="payment.organisation_name">
      <td class="govuk-table__cell tb-col-w">PBA account name</td>
      <td class="govuk-table__cell">{{ payment.organisation_name }}</td>
    </tr>
    <tr class="govuk-table__row" *ngIf="payment.account_number">
      <td class="govuk-table__cell tb-col-w">PBA number</td>
      <td class="govuk-table__cell">{{ payment.account_number }}</td>
    </tr>
    <tr class="govuk-table__row" *ngIf="payment.customer_reference">
      <td class="govuk-table__cell tb-col-w">Customer internal reference</td>
      <td class="govuk-table__cell">{{ payment.customer_reference }}</td>
    </tr>
    </tbody>
  </table>

<h1 class="govuk-heading-xl">Cases</h1>

<table class="govuk-table">
  <thead class="govuk-table__head">
    <tr class="govuk-table__row">
      <th scope="col" class="govuk-table__header">Case reference</th>
      <th scope="col" class="govuk-table__header">Petitioner</th>
      <th scope="col" class="govuk-table__header">Respondent</th>
      <th scope="col" class="govuk-table__header">Date of last court action</th>
      <th scope="col" class="govuk-table__header">Application status</th>
    </tr>
  </thead>
  <tbody class="govuk-table__body">
    <tr *ngFor="let case of cases" class="govuk-table__row">
      <td class="govuk-table__cell">
        <a class="govuk-link" routerLink="/payment-lib-int/{{ case.ccdCaseNumber }}" [queryParams]="{ paymentMethod: 'card' }">{{ case.ccdCaseNumber }}</a>
      </td>
      <td class="govuk-table__cell">{{ case.petitioner }}</td>
      <td class="govuk-table__cell">{{ case.respondent }}</td>
      <td class="govuk-table__cell">{{ case.dateOfLastCourtAction }}</td>
      <td class="govuk-table__cell">{{ case.applicationStatus }}</td>
    </tr>
  </tbody>
</table>
